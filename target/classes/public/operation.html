<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS INDUSTRIAL | OPERATOR HMI</title>
    <style>
        /* INDUSTRIAL HMI THEME */
        :root {
            --bg-base: #0a0a0a;
            --panel-bg: #141414;
            --panel-border: #333;
            --text-main: #e0e0e0;
            --text-muted: #777;
            --accent-blue: #00bcd4;
            --state-operating: #2ecc71;
            --state-stopped: #95a5a6;
            --state-failure: #ff5252;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER PANEL */
        header {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 2px solid var(--accent-blue);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,255,255,0.1);
        }

        .header-title {
            display: flex;
            flex-direction: column;
        }

        .header-title h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent-blue);
        }

        .header-title span {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 3px;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn-logout:hover {
            border-color: var(--state-failure);
            color: var(--state-failure);
        }

        /* MAIN LAYOUT */
        .hmi-layout {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            flex: 1;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 5px;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        /* LEFT SIDEBAR: ASSET SELECTION */
        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        select {
            background: #000;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 10px;
            font-size: 1rem;
            font-family: var(--font-mono);
            outline: none;
            cursor: pointer;
        }

        .system-status {
            margin-top: auto;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* CENTER: MOTOR GRAPHIC */
        .center-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .motor-graphic {
            width: 250px;
            height: 250px;
            margin-bottom: 20px;
        }

        /* SVG Dynamic Classes */
        .svg-operating { stroke: var(--state-operating); filter: drop-shadow(0 0 10px var(--state-operating)); }
        .svg-stopped { stroke: var(--state-stopped); }
        .svg-failure { stroke: var(--state-failure); filter: drop-shadow(0 0 10px var(--state-failure)); animation: blink 1s infinite; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .state-label {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 5px 20px;
            border-radius: 3px;
            background: #000;
            border: 1px solid #333;
        }

        .label-operating { color: var(--state-operating); border-color: var(--state-operating); }
        .label-stopped { color: var(--state-stopped); }
        .label-failure { color: var(--state-failure); border-color: var(--state-failure); }

        /* RIGHT: TELEMETRY VALUES */
        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            flex: 1;
        }

        .telemetry-box {
            background: #000;
            border: 1px solid var(--panel-border);
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-left: 4px solid #333;
            transition: 0.3s;
        }

        .telemetry-box span {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .telemetry-value {
            font-family: var(--font-mono);
            font-size: 1.8rem;
            color: #fff;
            margin-top: 5px;
        }

        /* FOOTER: CONTROLS */
        .controls-panel {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px;
            background: #0f0f0f;
            border-top: 1px solid var(--panel-border);
        }

        .btn-industrial {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            transition: 0.1s;
        }

        .btn-industrial:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .btn-industrial:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-start { background: var(--state-operating); color: #000; }
        .btn-stop { background: var(--state-failure); color: #fff; }
        .btn-reset { background: var(--accent-blue); color: #000; }

    </style>
</head>
<body>

<header>
    <div class="header-title">
        <h1>NEXUS INDUSTRIAL | OPERATOR HMI</h1>
        <span>CORE SYSTEM v4.0 - ENHANCED SYSTEM</span>
    </div>
    <button class="btn-logout" onclick="window.location.href='index.html'">Logout</button>
</header>

<div class="hmi-layout">

    <div class="panel">
        <div class="panel-title">Asset Control</div>
        <div class="selector-group">
            <label for="assetSelect" style="font-size: 0.8rem; color: #777;">Target Equipment</label>
            <select id="assetSelect" onchange="changeAsset()">
                <option value="">Awaiting Data...</option>
            </select>
        </div>

        <div class="system-status">
            <p id="ws-status">Network: CONNECTING...</p>
            <p>Protocol: MQTT via Core</p>
        </div>
    </div>

    <div class="panel center-display">
        <div class="panel-title" style="align-self: flex-start;">Real-Time Diagnostic</div>

        <svg viewBox="0 0 100 100" class="motor-graphic svg-stopped" id="motor-svg" fill="none" stroke-width="2">
            <rect x="10" y="80" width="80" height="10" fill="#222" stroke="currentColor"/>
            <rect x="20" y="30" width="60" height="50" rx="5" fill="#111" stroke="currentColor"/>
            <line x1="30" y1="30" x2="30" y2="80" stroke="currentColor"/>
            <line x1="40" y1="30" x2="40" y2="80" stroke="currentColor"/>
            <line x1="50" y1="30" x2="50" y2="80" stroke="currentColor"/>
            <line x1="60" y1="30" x2="60" y2="80" stroke="currentColor"/>
            <line x1="70" y1="30" x2="70" y2="80" stroke="currentColor"/>
            <rect x="80" y="45" width="15" height="10" fill="#333" stroke="currentColor"/>
            <circle cx="20" cy="55" r="15" fill="#111" stroke="currentColor"/>
        </svg>

        <div id="state-display" class="state-label label-stopped">NO CONNECTION</div>
    </div>

    <div class="panel">
        <div class="panel-title">Live Telemetry</div>
        <div class="telemetry-grid">
            <div class="telemetry-box" id="box-temp">
                <span>Temperature</span>
                <div class="telemetry-value" id="val-temp">-- °C</div>
            </div>
            <div class="telemetry-box" id="box-curr">
                <span>Current</span>
                <div class="telemetry-value" id="val-curr">-- A</div>
            </div>
            <div class="telemetry-box" id="box-vib">
                <span>Vibration</span>
                <div class="telemetry-value" id="val-vib">-- mm/s</div>
            </div>
            <div class="telemetry-box" id="box-humi">
                <span>Humidity</span>
                <div class="telemetry-value" id="val-humi">-- %</div>
            </div>
        </div>
    </div>

    <div class="controls-panel">
        <button class="btn-industrial btn-start" id="btn-start" onclick="sendCommand('START')" disabled>START</button>
        <button class="btn-industrial btn-stop" id="btn-stop" onclick="sendCommand('STOP')" disabled>STOP</button>
        <button class="btn-industrial btn-reset" id="btn-reset" onclick="sendCommand('RESET')" disabled>SYS RESET</button>
    </div>

</div>

<script>
    let ws;
    let currentAssetId = null;

    window.onload = () => {
        fetchAssets();
        connectWebSocket();
    };

    function fetchAssets() {
        // Updated to fetch directly from the current domain
        fetch('/api/assets')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('assetSelect');
                select.innerHTML = '';
                if(data.length === 0) {
                    select.innerHTML = '<option>No assets registered</option>';
                    return;
                }
                data.forEach(motor => {
                    let opt = document.createElement('option');
                    opt.value = motor.id;
                    opt.textContent = `ID ${motor.id} - ${motor.name}`;
                    select.appendChild(opt);
                });
                currentAssetId = select.value;
            })
            .catch(err => console.error("[NEXUS] API Fetch Error:", err));
    }

    function changeAsset() {
        currentAssetId = document.getElementById('assetSelect').value;
        console.log("[NEXUS] Switched monitoring to Asset ID:", currentAssetId);

        // Clear UI values while waiting for new data
        document.getElementById('val-temp').innerText = "-- °C";
        document.getElementById('val-curr').innerText = "-- A";
        document.getElementById('val-vib').innerText = "-- mm/s";
        document.getElementById('val-humi').innerText = "-- %";
        updateMotorState("UNKNOWN");
    }

    function connectWebSocket() {
        // WSS for HTTPS (Render), WS for local HTTP
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const wsUrl = wsProtocol + window.location.host + "/ws";

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            console.log("[NEXUS] WebSocket Connected.");
            document.getElementById('ws-status').innerText = "Network: ONLINE";
            document.getElementById('ws-status').style.color = "var(--state-operating)";
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                // Only process data if it matches the currently selected dropdown ID
                if (currentAssetId && data.id == currentAssetId) {
                    updateUI(data);
                }
            } catch (e) {
                console.error("[NEXUS] JSON Parse Error:", e);
            }
        };

        ws.onclose = () => {
            console.warn("[NEXUS] WebSocket link lost. Reconnecting...");
            document.getElementById('ws-status').innerText = "Network: OFFLINE";
            document.getElementById('ws-status').style.color = "var(--state-failure)";
            setTimeout(connectWebSocket, 3000);
        };
    }

    function updateUI(data) {
        // Fixed variable names mapping exactly to Java backend JSON keys
        const tempVal = data.temp !== undefined ? data.temp.toFixed(1) : "--";
        const currVal = data.curr !== undefined ? data.curr.toFixed(2) : "--";
        const vibVal = data.vib !== undefined ? data.vib.toFixed(1) : "--";
        const humiVal = data.humi !== undefined ? data.humi.toFixed(1) : "--";

        document.getElementById('val-temp').innerText = tempVal + " °C";
        document.getElementById('val-curr').innerText = currVal + " A";
        document.getElementById('val-vib').innerText = vibVal + " mm/s";
        document.getElementById('val-humi').innerText = humiVal + " %";

        updateMotorState(data.state);

        // Dynamic border alerting based on limits from Java
        checkAlert('box-temp', data.temp, data.limitTemp);
        checkAlert('box-curr', data.curr, data.limitCurr);
        checkAlert('box-vib', data.vib, data.limitVib);
    }

    function updateMotorState(state) {
        const display = document.getElementById('state-display');
        const svg = document.getElementById('motor-svg');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnReset = document.getElementById('btn-reset');

        display.innerText = state || "UNKNOWN";

        // Reset classes
        display.className = "state-label";
        svg.className.baseVal = "motor-graphic";

        if (state === "OPERATING") {
            display.classList.add("label-operating");
            svg.classList.add("svg-operating");
            btnStart.disabled = true;
            btnStop.disabled = false;
            btnReset.disabled = true;
        } else if (state === "LOCKED_FAILURE") {
            display.classList.add("label-failure");
            svg.classList.add("svg-failure");
            btnStart.disabled = true;
            btnStop.disabled = true;
            btnReset.disabled = false;
        } else { // STOPPED or IDLE
            display.classList.add("label-stopped");
            svg.classList.add("svg-stopped");
            btnStart.disabled = false;
            btnStop.disabled = true;
            btnReset.disabled = true;
        }
    }

    function checkAlert(elementId, currentValue, limitValue) {
        const box = document.getElementById(elementId);
        if (!currentValue || !limitValue) return;

        // Simple threshold check: if within 10% of limit, warning. If over limit, critical.
        if (currentValue >= limitValue) {
            box.style.borderLeftColor = "var(--state-failure)";
        } else if (currentValue >= (limitValue * 0.9)) {
            box.style.borderLeftColor = "#f39c12"; // Warning orange
        } else {
            box.style.borderLeftColor = "#333"; // Normal
        }
    }

    function sendCommand(cmd) {
        if (ws && ws.readyState === WebSocket.OPEN && currentAssetId) {
            const payload = `${currentAssetId}:${cmd}`;
            ws.send(payload);
            console.log("[NEXUS] Sent Command:", payload);
        } else {
            alert("Cannot send command. WebSocket is not connected.");
        }
    }
</script>
</body>
</html>
