<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS - Authentication Portal</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card {
            background: #1a1a1a; padding: 40px; border-radius: 12px;
            border-top: 5px solid #2196f3; width: 350px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333;
        }
        h2 { letter-spacing: 3px; margin-bottom: 10px; color: #2196f3; font-weight: 800; }
        .subtitle { color: #555; font-size: 0.8rem; margin-bottom: 25px; text-transform: uppercase; }

        input { width: 100%; padding: 12px; margin: 10px 0; background: #0f0f0f; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #2196f3; box-shadow: 0 0 8px rgba(33, 150, 243, 0.3); }

        button { width: 100%; padding: 12px; background: #2196f3; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-top: 15px; letter-spacing: 1px; }
        button:hover { background: #1976d2; transform: translateY(-2px); }

        .error { color: #ff5252; font-size: 0.85rem; margin-top: 15px; display: none; background: rgba(255,82,82,0.1); padding: 8px; border-radius: 4px; border: 1px solid rgba(255,82,82,0.3); }

        .hint { margin-top: 20px; font-size: 0.7rem; color: #444; text-align: left; line-height: 1.4; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>NEXUS CORE</h2>
    <div class="subtitle">Industrial Control Portal</div>

    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">

    <button onclick="doLogin()">AUTHENTICATE SYSTEM</button>

    <div id="err" class="error">Access Denied: Invalid Credentials</div>

    <div class="hint">
        <strong>Testing Modes:</strong><br>
        • director / admin123 (Full Plant View)<br>
        • gerente / ger123 (Management & KPIs)<br>
        • operador / op123 (Machine Control)
    </div>
</div>

<script>
    /**
     * Unified Login Logic
     * Redirects users to their specific automation tier
     */
    function doLogin() {
        const user = document.getElementById('user').value.toLowerCase();
        const pass = document.getElementById('pass').value;
        const errDiv = document.getElementById('err');

        // Authentication and redirection mapping
        if (user === "diretor" && pass === "admin123") {
            window.location.href = "Executive_supervision.html";
        }
        else if (user === "gerente" && pass === "ger123") {
            window.location.href = "management.html";
        }
        else if (user === "operador" && pass === "op123") {
            window.location.href = "operation.html";
        }
        else {
            errDiv.style.display = "block";
            errDiv.innerText = "Error: Invalid Username or Password for this tier.";
        }
    }

    // Submit on Enter key
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
